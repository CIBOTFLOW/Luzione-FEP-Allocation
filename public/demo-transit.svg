<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Transit pass and morning notebook</title>
  <desc id="description">A transit card, notebook, and coffee arranged on a soft cream surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f0df"/>
      <stop offset="1" stop-color="#dcc8a4"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g transform="translate(130 140) rotate(-7)" filter="url(#shadow)">
    <rect width="505" height="684" rx="30" fill="#fbfaf5"/>
    <rect width="56" height="684" rx="28" fill="#315845"/>
    <g stroke="#d7d4ca" stroke-width="5">
      <path d="M105 125h330M105 215h330M105 305h330M105 395h330M105 485h330"/>
    </g>
  </g>
  <g transform="translate(486 495) rotate(9)" filter="url(#shadow)">
    <rect width="420" height="258" rx="32" fill="#224a38"/>
    <circle cx="330" cy="73" r="29" fill="#e0b853"/>
    <path d="M54 181h312" stroke="#c9ded1" stroke-width="18" stroke-linecap="round"/>
    <text x="54" y="103" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">MONTH ONE</text>
  </g>
  <g transform="translate(700 154)" filter="url(#shadow)">
    <circle cx="110" cy="110" r="110" fill="#faf8f0"/>
    <circle cx="110" cy="110" r="78" fill="#8a5a39"/>
    <path d="M207 72c83 0 91 92 18 116" fill="none" stroke="#faf8f0" stroke-width="28" stroke-linecap="round"/>
  </g>
  <text x="74" y="995" fill="#654a2e" font-family="Arial, sans-serif" font-size="38" font-weight="700">A first week made reachable.</text>
</svg>
